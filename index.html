    <style>
        :root {
            /* Light Theme */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --header-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --header-text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --hover-bg: #f8fafc;
            --icon-bg: #f1f5f9;
            --search-bg: rgba(255, 255, 255, 0.95);
            --filter-btn-bg: #e2e8f0;
            --filter-btn-text: #475569;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --header-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --header-text: #ffffff;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --hover-bg: rgba(51, 65, 85, 0.5);
            --icon-bg: #334155;
            --search-bg: rgba(30, 41, 59, 0.9);
            --filter-btn-bg: #334155;
            --filter-btn-text: #cbd5e1;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 15px;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        /* Top Bar for Theme Toggle */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -20px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* Header e Titolo */
        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--text-primary);
            margin: 0 0 10px 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
        }
        
        [data-theme="light"] h1 {
            background: linear-gradient(90deg, #1e293b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #date-display {
            display: inline-block;
            background: var(--header-gradient);
            color: white;
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 15px;
            font-weight: 500;
        }

        /* Controlli (Ricerca, Bottoni, Filtri) */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }

        #search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            background-color: var(--search-bg);
        }
        
        #search-input::placeholder {
            color: var(--text-secondary);
        }

        #search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-reload {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-reload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        /* Pillole Filtro Sport */
        .filters-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .filter-btn {
            background: var(--filter-btn-bg);
            color: var(--filter-btn-text);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            transform: translateY(-1px);
            background: var(--hover-bg);
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        /* Card Principale */
        .schedule-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            min-height: 200px;
            transition: transform 0.3s ease, background 0.3s ease, border 0.3s ease;
        }

        .no-events {
            text-align: center;
            font-size: 1.3rem;
            color: var(--text-secondary);
            padding: 60px 20px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .no-events::before {
            content: "🏜️";
            font-size: 3rem;
        }

        /* Tabella */
        .table-responsive {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }
        
        thead {
            background: var(--header-gradient);
            color: var(--header-text);
        }
        
        th, td {
            padding: 18px 20px;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
            word-break: break-word;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #cbd5e1;
        }

        th:first-child { padding-left: 30px; }
        td:first-child { padding-left: 30px; }
        th:last-child { padding-right: 30px; }
        td:last-child { padding-right: 30px; }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background-color: var(--hover-bg);
            transform: scale(1.002);
            box-shadow: inset 4px 0 0 var(--accent-color);
        }

        /* In Corso Style */
        tbody tr.live-now {
            background-color: rgba(239, 68, 68, 0.05);
            border-left: 4px solid #ef4444;
        }
        
        [data-theme="dark"] tbody tr.live-now {
            background-color: rgba(239, 68, 68, 0.1);
        }

        tbody tr.live-now:hover {
            background-color: rgba(239, 68, 68, 0.08);
            box-shadow: none;
        }
        [data-theme="dark"] tbody tr.live-now:hover {
            background-color: rgba(239, 68, 68, 0.15);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Elementi specifici */
        .time {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        
        .time-badge {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
        }
        
        [data-theme="dark"] .time-badge {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .time-badge.stimato {
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
            border: 1px dashed rgba(245, 158, 11, 0.4);
        }
        
        [data-theme="dark"] .time-badge.stimato {
            color: #fbbf24;
        }

        .live-badge {
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 800;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .evento-testo {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .sport-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--icon-bg);
            border-radius: 10px;
            margin-right: 10px;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            vertical-align: middle;
        }

        .competizione-testo {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .highlight-athlete {
            color: #ea580c;
            font-weight: 800;
            background: rgba(234, 88, 12, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
        }
        
        [data-theme="dark"] .highlight-athlete {
            color: #fb923c;
        }

        .note-testo {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
        }

        .chip {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: normal;
            letter-spacing: 0.3px;
            transition: transform 0.2s;
        }

        .chip:hover {
            transform: translateY(-1px);
        }

        /* Chips colors (Adattate per Light/Dark) */
        .chip-sky { background: #e0f2fe; color: #1e3a8a; border: 1px solid #bfdbfe; }
        .chip-dazn { background: #fef08a; color: #000000; border: 1px solid #fde047; }
        .chip-now { background: #dcfce7; color: #3f6212; border: 1px solid #bbf7d0; }
        .chip-rai { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; border-left: 4px solid #3b82f6;}
        .chip-mediaset { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }
        .chip-amazon { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .chip-tv8 { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
        .chip-nove { background: #f3e8ff; color: #831843; border: 1px solid #fbcfe8; }
        .chip-default { background: var(--filter-btn-bg); color: var(--text-primary); border: 1px solid var(--border-color); }
        
        /* Dark mode overrides for specific chips */
        [data-theme="dark"] .chip-sky { background: rgba(2, 132, 199, 0.2); color: #bae6fd; border-color: rgba(2, 132, 199, 0.4); }
        [data-theme="dark"] .chip-dazn { background: rgba(234, 179, 8, 0.2); color: #fde047; border-color: rgba(234, 179, 8, 0.4); }
        [data-theme="dark"] .chip-now { background: rgba(22, 163, 74, 0.2); color: #bbf7d0; border-color: rgba(22, 163, 74, 0.4); }
        [data-theme="dark"] .chip-rai { background: rgba(71, 85, 105, 0.4); color: #f1f5f9; border-color: #475569; }
        [data-theme=\"dark\"] .chip-mediaset { background: rgba(71, 85, 105, 0.4); color: #f1f5f9; border-color: #475569; }
        [data-theme="dark"] .chip-amazon { background: rgba(234, 88, 12, 0.2); color: #fdba74; border-color: rgba(234, 88, 12, 0.4); }

        @media (max-width: 850px) {
            body { padding: 15px 10px; }
            h1 { font-size: 1.8rem; }
            
            .top-bar { margin-bottom: 0; }
            
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            
            .schedule-container {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 0;
            }

            tr {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                margin-bottom: 20px;
                border-radius: 16px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.04);
                padding: 10px 0;
                position: relative;
            }
            
            tr:hover {
                transform: none;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            }
            
            tr.live-now {
                border-left: 4px solid #ef4444;
            }

            td {
                border: none;
                position: relative;
                padding: 12px 20px 12px 35% !important;
                text-align: right;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
            }
            
            td:not(:last-child) {
                border-bottom: 1px dashed var(--border-color);
            }

            td:before {
                position: absolute;
                top: 15px;
                left: 20px;
                width: 30%;
                white-space: nowrap;
                text-align: left;
                font-weight: 700;
                font-size: 0.8rem;
                text-transform: uppercase;
                color: #94a3b8;
                letter-spacing: 0.5px;
            }

            td:nth-of-type(1):before { content: "Orario"; }
            td:nth-of-type(2):before { content: "Evento"; }
            td:nth-of-type(3):before { content: "Competizione"; }
            td:nth-of-type(4):before { content: "Canale TV"; }
            td:nth-of-type(5):before { content: "Note"; }
            
            .chip-container { justify-content: flex-end; }
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <!-- Theme Toggle -->
        <div class="top-bar">
            <button id="theme-toggle-btn" class="theme-toggle" title="Cambia Tema">
                🌙
            </button>
        </div>

        <div class="page-header">
            <h1>Programma Sportivo in TV</h1>
            <div id="date-display"></div>
            <div id="last-updated" class="last-updated">Ultimo aggiornamento dati: recupero...</div>
        </div>

        <div class="controls-wrapper">
            <div class="action-bar">
                <input type="text" id="search-input" placeholder="Cerca squadra, sport, canale...">
                <a href="https://github.com/Zizzo91/programma-sportivo-oggi/actions/workflows/update.yml" target="_blank" class="btn-reload" title="Forza la ricerca manuale su GitHub">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Aggiorna Dati
                </a>
            </div>
            
            <!-- Sport Filters -->
            <div class="filters-container" id="sport-filters">
                <button class="filter-btn active" data-sport="all">Tutti</button>
                <button class="filter-btn" data-sport="calcio">⚽ Calcio</button>
                <button class="filter-btn" data-sport="tennis">🎾 Tennis</button>
                <button class="filter-btn" data-sport="motori">🏎️ Motori</button>
                <button class="filter-btn" data-sport="volley">🏐 Volley</button>
                <button class="filter-btn" data-sport="sci">🎿 Sci</button>
            </div>
        </div>
        
        <div class="schedule-container" id="schedule-container">
            <div style="text-align:center; padding: 60px; color: var(--text-secondary);">
                <div style="font-size: 2rem; margin-bottom: 15px;">⏳</div>
                Caricamento palinsesto in corso...
            </div>
        </div>
    </div>

    <script>
  // --- Service Worker Registration per PWA ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrato con successo.', reg))
        .catch(err => console.log('Registrazione Service Worker fallita.', err));
    });
  }

  // --- Gestione Tema (Dark/Light) ---
  const themeBtn = document.getElementById('theme-toggle-btn');
  
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.body.setAttribute('data-theme', 'dark');
      themeBtn.innerText = '☀️';
  }

  themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
          document.body.setAttribute('data-theme', 'light');
          themeBtn.innerText = '🌙';
          localStorage.setItem('theme', 'light');
      } else {
          document.body.setAttribute('data-theme', 'dark');
          themeBtn.innerText = '☀️';
          localStorage.setItem('theme', 'dark');
      }
  });

  // --- Utility di Formattazione ---
  const options = { timeZone: 'Europe/Rome', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-display').innerText =
    new Date().toLocaleDateString('it-IT', options).toUpperCase();

  const ITALIAN_NAMES = [
    "Sinner", "Musetti", "Berrettini", "Paolini", "Errani", "Cobolli", "Arnaldi", "Sonego",
    "Bolelli", "Vavassori",
    "Brignone", "Goggia", "Bassino", "Curtoni",
    "Ferrari", "Ducati", "Aprilia"
  ];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function getChipClass(channelName) {
    const c = channelName.toLowerCase();
    if (c.includes("sky")) return "chip-sky";
    if (c.includes("dazn")) return "chip-dazn";
    if (c.includes("now")) return "chip-now";
    if (c.includes("rai")) return "chip-rai";
    if (c.includes("amazon") || c.includes("prime")) return "chip-amazon";
    if (c.includes("tv8")) return "chip-tv8";
    if (c.includes("nove") || c.includes("discovery")) return "chip-nove";
    if (c.includes("mediaset") || c.includes("canale 5") || c.includes("italia 1")) return "chip-mediaset";
    return "chip-default";
  }

  function formatChannel(canale) {
    const raw = String(canale ?? "").trim();
    if (!raw || raw === "-") return '<div class="chip-container"><span class="chip chip-default">-</span></div>';

    const parts = raw
      .split(/(?:\/|,| e | e\s+)/gi)
      .map(s => s.trim())
      .filter(Boolean);

    if (parts.length === 0) {
        return `<div class="chip-container"><span class="chip ${getChipClass(raw)}">${escapeHtml(raw)}</span></div>`;
    }

    const chipsHtml = parts.map(p => `<span class="chip ${getChipClass(p)}">${escapeHtml(p)}</span>`).join("");
    return `<div class="chip-container">${chipsHtml}</div>`;
  }

  function highlightItalians(text) {
    let out = escapeHtml(text ?? "-");
    for (const name of ITALIAN_NAMES) {
      const re = new RegExp(`\\b(${name})\\b`, "gi");
      out = out.replace(re, "<span class=\"highlight-athlete\">$1</span>");
    }
    return out;
  }

  function detectSport(ev) {
    const s = `${ev?.competizione ?? ""} ${ev?.evento ?? ""}`.toLowerCase();
    if (s.includes("atp") || s.includes("wta") || s.includes("tennis")) return "tennis";
    if (s.includes("formula 1") || s.includes(" f1") || s.includes("gran premio")) return "f1";
    if (s.includes("motogp") || s.includes("moto2") || s.includes("moto3") || s.includes("sbk")) return "motogp";
    if (s.includes("volley") || s.includes("pallavolo") || s.includes("superlega") || s.includes("champions league maschile") && s.includes("trentino")) return "volley";
    if (s.includes("sci") || s.includes("slalom") || s.includes("discesa") || s.includes("superg") || s.includes("gigante") || s.includes("coppa del mondo")) return "sci";
    if (s.includes("serie a") || s.includes("champions") || s.includes("europa") || s.includes("conference") || s.includes("calcio") || s.includes("premier") || s.includes("liga")) return "calcio";
    return "altro";
  }
  
  // Funzione per convertire stringa orario (es "15:30") in minuti per ordinamento
  function timeToMinutes(timeStr) {
      if (!timeStr || timeStr === "TBA" || timeStr === "TBD") return 9999; // TBA in fondo
      const cleanStr = timeStr.replace('*', '').trim();
      const match = cleanStr.match(/(\d{1,2})[.:](\d{2})/);
      if (match) {
          let h = parseInt(match[1], 10);
          let m = parseInt(match[2], 10);
          // Sposta gli eventi notturni (00:00 - 05:59) alla fine della giornata logica (aggiunge 24h)
          if (h >= 0 && h < 6) h += 24;
          return h * 60 + m;
      }
      return 9999;
  }
  
  // Controlla se un evento è in corso (entro 2 ore dall'inizio)
  function isLiveNow(timeStr) {
      if (!timeStr || timeStr === "TBA") return false;
      const cleanStr = timeStr.replace('*', '').trim();
      const match = cleanStr.match(/(\d{1,2})[.:](\d{2})/);
      if (!match) return false;
      
      const eventH = parseInt(match[1], 10);
      const eventM = parseInt(match[2], 10);
      
      const now = new Date();
      const nowH = now.getHours();
      const nowM = now.getMinutes();
      
      const eventTotal = eventH * 60 + eventM;
      const nowTotal = nowH * 60 + nowM;
      
      // Se l'evento è iniziato da massimo 120 minuti, consideralo LIVE
      // (gestione base, non copre il passaggio della mezzanotte, ma per la TV giornaliera è ok)
      if (nowTotal >= eventTotal && nowTotal <= eventTotal + 120) {
          return true;
      }
      return false;
  }

  const FILTER_MAP = {
      calcio: ["calcio"],
      tennis: ["tennis"],
      motori: ["f1", "motogp"],
      volley: ["volley"],
      sci: ["sci"]
  };

  const SPORT_ICON = {
    calcio: "⚽",
    tennis: "🎾",
    f1: "🏎️",
    motogp: "🏍️",
    volley: "🏐",
    sci: "🎿",
    altro: "🏟️"
  };

  // --- Fetch Dati ed Elaborazione ---
  fetch('data.json?v=' + new Date().getTime())
    .then(r => r.json())
    .then(data => {
      let events = [];
      if (Array.isArray(data)) {
          events = data;
          document.getElementById('last-updated').innerText = `Ultimo aggiornamento dati: Sconosciuto (formato precedente)`;
      } else if (data.events && Array.isArray(data.events)) {
          events = data.events;
          if(data.last_updated) {
              const modDate = new Date(data.last_updated);
              const timeString = modDate.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
              document.getElementById('last-updated').innerText = `Dati aggiornati oggi alle ${timeString}`;
          }
      }

      const container = document.getElementById('schedule-container');

      if (events.length === 0) {
        container.innerHTML = '<div class="no-events">Nessun evento in TV oggi per le tue categorie.</div>';
        return;
      }

      // ORDINAMENTO CRONOLOGICO
      events.sort((a, b) => timeToMinutes(a.orario) - timeToMinutes(b.orario));

      let html = `
        <div class="table-responsive">
          <table id="events-table">
            <thead>
              <tr>
                <th style="width: 12%;">Orario</th>
                <th style="width: 30%;">Evento</th>
                <th style="width: 25%;">Competizione</th>
                <th style="width: 20%;">Canale TV</th>
                <th style="width: 13%;">Note</th>
              </tr>
            </thead>
            <tbody>
      `;

      events.forEach(ev => {
        const sport = detectSport(ev);
        const icon = SPORT_ICON[sport] || SPORT_ICON.altro;
        
        const searchableText = `${ev.orario} ${ev.evento} ${ev.competizione} ${ev.canale} ${ev.note || ''} ${sport}`.toLowerCase();
        
        const isEstim = ev.accuratezza_orario === 'stimato' || ev.accuratezza_orario === 'tba' || String(ev.orario).includes('*');
        const badgeClass = isEstim ? 'time-badge stimato' : 'time-badge';
        const isLive = isLiveNow(ev.orario);
        
        // Costruzione HTML Orario
        let orarioHtml = `<span class="${badgeClass}">${escapeHtml(ev.orario)}${isEstim ? ' <span title="Orario indicativo" style="cursor:help">⏱️</span>' : ''}</span>`;
        if (isLive) {
            orarioHtml += `<span class="live-badge">🔴 Live</span>`;
        }
        
        const tooltipStr = ev.fonte ? `Fonte informazione: ${escapeHtml(ev.fonte)}` : '';
        const rowClass = isLive ? 'live-now' : '';

        // Aggiungiamo data-sport-type per i bottoni
        html += `
          <tr class="${rowClass}" data-search="${escapeHtml(searchableText)}" data-sport-type="${sport}" title="${tooltipStr}">
            <td class="time">${orarioHtml}</td>
            <td class="evento-testo">${highlightItalians(ev.evento)}</td>
            <td>
                <span class="sport-icon" title="${sport}">${icon}</span>
                <span class="competizione-testo">${highlightItalians(ev.competizione)}</span>
            </td>
            <td class="channel">${formatChannel(ev.canale)}</td>
            <td class="note-testo">${highlightItalians(ev.note || "")}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // --- Funzionalità Filtri Congiunti (Ricerca + Bottoni) ---
      const searchInput = document.getElementById('search-input');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const rows = document.querySelectorAll('#events-table tbody tr');
      
      let currentSearchTerm = "";
      let currentSportFilter = "all";

      function applyFilters() {
          let visibleCount = 0;
          
          rows.forEach(row => {
              const text = row.getAttribute('data-search');
              const rowSport = row.getAttribute('data-sport-type');
              
              // Verifica ricerca testuale
              const matchesSearch = text.includes(currentSearchTerm);
              
              // Verifica bottone sport
              let matchesSport = true;
              if (currentSportFilter !== "all") {
                  matchesSport = FILTER_MAP[currentSportFilter].includes(rowSport);
              }
              
              if (matchesSearch && matchesSport) {
                  row.style.display = '';
                  visibleCount++;
              } else {
                  row.style.display = 'none';
              }
          });

          // Gestione messaggio "Nessun risultato"
          const existingNoResult = document.getElementById('search-no-result');
          if(visibleCount === 0) {
              if(!existingNoResult) {
                  const noRes = document.createElement('div');
                  noRes.id = 'search-no-result';
                  noRes.className = 'no-events';
                  noRes.innerHTML = 'Nessun evento trovato per i filtri selezionati.';
                  document.querySelector('.table-responsive').appendChild(noRes);
              } else {
                  existingNoResult.style.display = 'flex';
              }
          } else if (existingNoResult) {
              existingNoResult.style.display = 'none';
          }
      }

      // Listener Ricerca
      searchInput.addEventListener('input', function(e) {
          currentSearchTerm = e.target.value.toLowerCase();
          applyFilters();
      });

      // Listener Bottoni Sport
      filterBtns.forEach(btn => {
          btn.addEventListener('click', function() {
              // Rimuovi active da tutti
              filterBtns.forEach(b => b.classList.remove('active'));
              // Aggiungi active al cliccato
              this.classList.add('active');
              
              currentSportFilter = this.getAttribute('data-sport');
              applyFilters();
          });
      });

    })
    .catch(err => {
      console.error(err);
      document.getElementById('schedule-container').innerHTML =
        '<div class="no-events" style="color: #ef4444;">❌ Impossibile caricare i dati. Errore di connessione o file non trovato.</div>';
    });
</script>
</body>
</html>
