<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programma Sportivo Italiano in TV Oggi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --header-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --header-text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --hover-bg: #f8fafc;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 15px;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header e Titolo */
        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--text-primary);
            margin: 0 0 10px 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #1e293b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #date-display {
            display: inline-block;
            background: var(--header-gradient);
            color: white;
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 15px;
            font-weight: 500;
        }

        /* Testo Ricerca Rapida */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        #search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            background-color: var(--card-bg);
        }

        #search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* CTA Ricarica */
        .action-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-reload {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-reload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-reload:active {
            transform: translateY(0);
        }

        /* Card Principale (Glassmorphism leggero) */
        .schedule-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            overflow: hidden;
            min-height: 200px;
            transition: transform 0.3s ease;
        }

        .no-events {
            text-align: center;
            font-size: 1.3rem;
            color: var(--text-secondary);
            padding: 60px 20px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .no-events::before {
            content: "🏜️";
            font-size: 3rem;
        }

        /* Tabella */
        .table-responsive {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }
        
        thead {
            background: var(--header-gradient);
            color: var(--header-text);
        }
        
        th, td {
            padding: 18px 20px;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
            word-break: break-word;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #cbd5e1;
        }

        th:first-child { padding-left: 30px; }
        td:first-child { padding-left: 30px; }
        th:last-child { padding-right: 30px; }
        td:last-child { padding-right: 30px; }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background-color: var(--hover-bg);
            transform: scale(1.002);
            box-shadow: inset 4px 0 0 var(--accent-color);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Elementi specifici */
        .time {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        
        .time-badge {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .evento-testo {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .sport-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-right: 10px;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            vertical-align: middle;
        }

        .competizione-testo {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .highlight-athlete {
            color: #ea580c;
            font-weight: 800;
            background: #fff7ed;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .note-testo {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
        }

        .chip {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: normal;
            letter-spacing: 0.3px;
            transition: transform 0.2s;
        }

        .chip:hover {
            transform: translateY(-1px);
        }

        .chip-sky { background: #e0f2fe; color: #1e3a8a; border: 1px solid #bfdbfe; }
        .chip-dazn { background: #fef08a; color: #000000; border: 1px solid #fde047; }
        .chip-now { background: #dcfce7; color: #3f6212; border: 1px solid #bbf7d0; }
        .chip-rai { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; border-left: 4px solid #3b82f6;}
        .chip-mediaset { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }
        .chip-amazon { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .chip-tv8 { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
        .chip-nove { background: #f3e8ff; color: #831843; border: 1px solid #fbcfe8; }
        .chip-default { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }

        @media (max-width: 850px) {
            body { padding: 15px 10px; }
            h1 { font-size: 1.8rem; }
            
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            
            .schedule-container {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 0;
            }

            tr {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                margin-bottom: 20px;
                border-radius: 16px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.04);
                padding: 10px 0;
                position: relative;
            }
            
            tr:hover {
                transform: none;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            }

            td {
                border: none;
                position: relative;
                padding: 12px 20px 12px 35% !important;
                text-align: right;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
            }
            
            td:not(:last-child) {
                border-bottom: 1px dashed #f1f5f9;
            }

            td:before {
                position: absolute;
                top: 15px;
                left: 20px;
                width: 30%;
                white-space: nowrap;
                text-align: left;
                font-weight: 700;
                font-size: 0.8rem;
                text-transform: uppercase;
                color: #94a3b8;
                letter-spacing: 0.5px;
            }

            td:nth-of-type(1):before { content: "Orario"; }
            td:nth-of-type(2):before { content: "Evento"; }
            td:nth-of-type(3):before { content: "Competizione"; }
            td:nth-of-type(4):before { content: "Canale TV"; }
            td:nth-of-type(5):before { content: "Note"; }
            
            .chip-container { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Programma Sportivo in TV</h1>
            <div id="date-display"></div>
            <div id="last-updated" class="last-updated">Ultimo aggiornamento dati: recupero...</div>
        </div>

        <div class="action-bar">
            <input type="text" id="search-input" placeholder="Cerca squadra, sport, canale...">
            <a href="https://github.com/Zizzo91/programma-sportivo-oggi/actions/workflows/update.yml" target="_blank" class="btn-reload" title="Forza la ricerca manuale su GitHub">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Aggiorna Dati
            </a>
        </div>
        
        <div class="schedule-container" id="schedule-container">
            <div style="text-align:center; padding: 60px; color: var(--text-secondary);">
                <div style="font-size: 2rem; margin-bottom: 15px;">⏳</div>
                Caricamento palinsesto in corso...
            </div>
        </div>
    </div>

    <script>
  const options = { timeZone: 'Europe/Rome', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-display').innerText =
    new Date().toLocaleDateString('it-IT', options).toUpperCase();

  const ITALIAN_NAMES = [
    "Sinner", "Musetti", "Berrettini", "Paolini", "Errani", "Cobolli", "Arnaldi", "Sonego",
    "Bolelli", "Vavassori",
    "Brignone", "Goggia", "Bassino", "Curtoni",
    "Ferrari", "Ducati", "Aprilia"
  ];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function getChipClass(channelName) {
    const c = channelName.toLowerCase();
    if (c.includes("sky")) return "chip-sky";
    if (c.includes("dazn")) return "chip-dazn";
    if (c.includes("now")) return "chip-now";
    if (c.includes("rai")) return "chip-rai";
    if (c.includes("amazon") || c.includes("prime")) return "chip-amazon";
    if (c.includes("tv8")) return "chip-tv8";
    if (c.includes("nove") || c.includes("discovery")) return "chip-nove";
    if (c.includes("mediaset") || c.includes("canale 5") || c.includes("italia 1")) return "chip-mediaset";
    return "chip-default";
  }

  function formatChannel(canale) {
    const raw = String(canale ?? "").trim();
    if (!raw || raw === "-") return '<div class="chip-container"><span class="chip chip-default">-</span></div>';

    const parts = raw
      .split(/(?:\/|,| e | e\s+)/gi)
      .map(s => s.trim())
      .filter(Boolean);

    if (parts.length === 0) {
        return `<div class="chip-container"><span class="chip ${getChipClass(raw)}">${escapeHtml(raw)}</span></div>`;
    }

    const chipsHtml = parts.map(p => `<span class="chip ${getChipClass(p)}">${escapeHtml(p)}</span>`).join("");
    return `<div class="chip-container">${chipsHtml}</div>`;
  }

  function highlightItalians(text) {
    let out = escapeHtml(text ?? "-");
    for (const name of ITALIAN_NAMES) {
      const re = new RegExp(`\\b(${name})\\b`, "gi");
      out = out.replace(re, "<span class=\"highlight-athlete\">$1</span>");
    }
    return out;
  }

  function detectSport(ev) {
    const s = `${ev?.competizione ?? ""} ${ev?.evento ?? ""}`.toLowerCase();
    if (s.includes("atp") || s.includes("wta") || s.includes("tennis")) return "tennis";
    if (s.includes("formula 1") || s.includes(" f1") || s.includes("gran premio")) return "f1";
    if (s.includes("motogp") || s.includes("moto2") || s.includes("moto3") || s.includes("sbk")) return "motogp";
    if (s.includes("volley") || s.includes("pallavolo") || s.includes("superlega") || s.includes("champions league maschile") && s.includes("trentino")) return "volley";
    if (s.includes("sci") || s.includes("slalom") || s.includes("discesa") || s.includes("superg") || s.includes("gigante") || s.includes("coppa del mondo")) return "sci";
    if (s.includes("serie a") || s.includes("champions") || s.includes("europa") || s.includes("conference") || s.includes("calcio") || s.includes("premier") || s.includes("liga")) return "calcio";
    return "altro";
  }

  const SPORT_ICON = {
    calcio: "⚽",
    tennis: "🎾",
    f1: "🏎️",
    motogp: "🏍️",
    volley: "🏐",
    sci: "🎿",
    altro: "🏟️"
  };

  fetch('data.json?v=' + new Date().getTime())
    .then(r => {
        // Leggi l'header Last-Modified per mostrare a che ora è stato aggiornato il JSON
        const lastMod = r.headers.get("Last-Modified");
        if(lastMod) {
            const modDate = new Date(lastMod);
            const timeString = modDate.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
            document.getElementById('last-updated').innerText = `Ultimo aggiornamento dati: Oggi alle ${timeString}`;
        } else {
            document.getElementById('last-updated').innerText = `Ultimo aggiornamento dati: Sconosciuto`;
        }
        return r.json();
    })
    .then(data => {
      const container = document.getElementById('schedule-container');

      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = '<div class="no-events">Nessun evento in TV oggi per le tue categorie.</div>';
        return;
      }

      let html = `
        <div class="table-responsive">
          <table id="events-table">
            <thead>
              <tr>
                <th style="width: 12%;">Orario</th>
                <th style="width: 30%;">Evento</th>
                <th style="width: 25%;">Competizione</th>
                <th style="width: 20%;">Canale TV</th>
                <th style="width: 13%;">Note</th>
              </tr>
            </thead>
            <tbody>
      `;

      data.forEach(ev => {
        const sport = detectSport(ev);
        const icon = SPORT_ICON[sport] || SPORT_ICON.altro;
        
        // Attributi data per facilitare la ricerca JS
        const searchableText = `${ev.orario} ${ev.evento} ${ev.competizione} ${ev.canale} ${ev.note || ''} ${sport}`.toLowerCase();

        html += `
          <tr data-search="${escapeHtml(searchableText)}">
            <td class="time"><span class="time-badge">${escapeHtml(ev.orario)}</span></td>
            <td class="evento-testo">${highlightItalians(ev.evento)}</td>
            <td>
                <span class="sport-icon" title="${sport}">${icon}</span>
                <span class="competizione-testo">${highlightItalians(ev.competizione)}</span>
            </td>
            <td class="channel">${formatChannel(ev.canale)}</td>
            <td class="note-testo">${highlightItalians(ev.note || "")}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // Inizializza funzionalità di ricerca
      const searchInput = document.getElementById('search-input');
      const rows = document.querySelectorAll('#events-table tbody tr');

      searchInput.addEventListener('input', function(e) {
          const term = e.target.value.toLowerCase();
          let visibleCount = 0;
          
          rows.forEach(row => {
              const text = row.getAttribute('data-search');
              if (text.includes(term)) {
                  row.style.display = '';
                  visibleCount++;
              } else {
                  row.style.display = 'none';
              }
          });

          // Mostra messaggio se non ci sono risultati per la ricerca
          const existingNoResult = document.getElementById('search-no-result');
          if(visibleCount === 0 && term !== "") {
              if(!existingNoResult) {
                  const noRes = document.createElement('div');
                  noRes.id = 'search-no-result';
                  noRes.className = 'no-events';
                  noRes.innerHTML = 'Nessun evento trovato per "'+ escapeHtml(term) +'"';
                  document.querySelector('.table-responsive').appendChild(noRes);
              } else {
                  existingNoResult.innerHTML = 'Nessun evento trovato per "'+ escapeHtml(term) +'"';
                  existingNoResult.style.display = 'flex';
              }
          } else if (existingNoResult) {
              existingNoResult.style.display = 'none';
          }
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById('schedule-container').innerHTML =
        '<div class="no-events" style="color: #ef4444;">❌ Impossibile caricare i dati. Errore di connessione o file non trovato.</div>';
    });
</script>
</body>
</html>
