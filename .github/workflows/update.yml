name: Aggiorna Dati Sportivi

on:
  workflow_dispatch:
  schedule:
    # Cron in UTC. In CET (UTC+1): 00:00, 06:00, 12:00, 18:00 UTC = 01:00, 07:00, 13:00, 19:00 CET
    # In CEST (UTC+2, estate): stesse righe = 02:00, 08:00, 14:00, 20:00 CEST (sfasamento automatico)
    - cron: '0 0,6,12,18 * * *'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pytz

      - name: Esegui script Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: Commit e Push delle modifiche
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico data.json" && git push)
