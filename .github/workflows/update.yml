name: Aggiorna Dati Sportivi

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,7 * * *'  # 08:00 Europe/Rome (gestisce CET/CEST via gate)

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Decide se eseguire (08:00 Europe/Rome)
        run: |
          echo "RUN_UPDATE=false" >> $GITHUB_ENV

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RUN_UPDATE=true" >> $GITHUB_ENV
            exit 0
          fi

          hour=$(TZ='Europe/Rome' date +'%H')
          echo "Ora Europe/Rome: $hour"
          if [ "$hour" = "08" ]; then
            echo "RUN_UPDATE=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.RUN_UPDATE == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: env.RUN_UPDATE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: env.RUN_UPDATE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pytz

      - name: Esegui script Gemini API
        if: env.RUN_UPDATE == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: Commit e Push delle modifiche
        if: env.RUN_UPDATE == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico data.json" && git push)
